<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIA news</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="mast"><div class="in">
  <div><h1 class="logo"><span>DIA</span><span class="dot" aria-hidden="true"></span><small>news</small></h1><div class="sub" id="t-sub"></div></div>
  <div class="mast-r"><span class="today" id="t-today"></span><div class="langs" role="group" aria-label="Language" id="langs"></div></div>
</div></header>
<nav class="sections" aria-label="Sections"><div class="in" id="filters"></div></nav>
<section class="hero"><div class="in">
  <div class="hx-meta"><span class="dot" id="h-eye"></span><span id="h-mid"></span><span class="dot" id="h-live"></span></div>
  <div class="hx-stage">
    <h2 class="kx" id="h-title"><span class="ln"><span class="w" id="h-l1"></span><button type="button" class="w pill" id="h-pill"><span class="pl-b"><i>▶</i><span id="h-pl"></span></span></button><span class="w" id="h-l1b"></span></span><span class="ln"><span class="w" id="h-l2"></span></span><span class="ln"><span class="w rot" id="h-rot"></span></span></h2>
    <svg class="scrib" viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" vector-effect="non-scaling-stroke" d="M2,14 C180,18 420,6 600,22 C700,30 730,70 700,112 C670,150 470,160 360,128 C300,110 320,48 420,38 C540,26 720,40 750,80 C775,112 730,175 770,208 C810,238 900,214 935,222 C985,236 965,288 925,278 C885,268 895,226 945,240 C985,252 975,295 880,312"></path></svg>
    <span class="scrib-dot" aria-hidden="true"></span>
    <div class="hx-stats" id="h-stats"></div>
  </div>
  <div class="hx-bot">
    <p id="h-dek"></p>
    <button type="button" class="now" id="h-now"><span class="now-img" id="h-now-img"></span><span><span class="now-k" id="h-now-k"></span><span class="now-t" id="h-now-t"></span><span class="now-d" id="h-now-d"></span></span></button>
    <button type="button" class="hx-scroll" id="h-scroll"><span id="h-scroll-t"></span><i>↓</i></button>
  </div>
</div></section>
<div class="ticker" id="ticker" hidden><span class="ticker-lab" id="t-break"></span><div class="ticker-win"><div class="ticker-track" id="ticker-track"></div></div></div>
<div class="in">
  <div class="meta-line"><span id="t-count"></span><span id="t-upd"></span></div>
  <main id="feed"><div class="state"><strong id="t-loading">Загрузка ленты…</strong></div></main>
  <p class="note" id="t-note"></p>
</div>
<script src="js/i18n.js"></script>
<script src="data/news.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/photos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
